; 메디힘 PHP 실행용 최소 php.ini
; 사용: php -c php.ini -S localhost:8000

; JS 안의 <?xml ... ?> 문자열을 PHP 태그로 오인하지 않도록 반드시 Off
short_open_tag = Off

; winget PHP 8.4 확장 폴더 (절대경로)
extension_dir = "C:\Users\user\AppData\Local\Microsoft\WinGet\Packages\PHP.PHP.8.4_Microsoft.Winget.Source_8wekyb3d8bbwe\ext"

extension=pdo_mysql
extension=mbstring
extension=openssl

default_charset = "UTF-8"
display_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
