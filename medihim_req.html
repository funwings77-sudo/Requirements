<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메디힘 업무관리 시스템</title>
<style>
  /* Noto Sans KR (오프라인 self-host) — 설치 시 local(), 미설치 시 woff2 자동 로드 */
  @font-face{font-family:'Noto Sans KR';font-style:normal;font-weight:400;font-display:swap;src:local('Noto Sans KR'),local('NotoSansKR-Regular'),url('/assets/vendor/fonts/notosanskr-latin-400.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:'Noto Sans KR';font-style:normal;font-weight:400;font-display:swap;src:local('Noto Sans KR'),local('NotoSansKR-Regular'),url('/assets/vendor/fonts/notosanskr-korean-400.woff2') format('woff2');unicode-range:U+1100-11FF,U+3001-303F,U+3130-318F,U+3200-321E,U+3260-327F,U+4E00-9FFF,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF,U+F900-FAFF,U+FF01-FFEE;}
  @font-face{font-family:'Noto Sans KR';font-style:normal;font-weight:700;font-display:swap;src:local('Noto Sans KR'),local('NotoSansKR-Bold'),url('/assets/vendor/fonts/notosanskr-latin-700.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:'Noto Sans KR';font-style:normal;font-weight:700;font-display:swap;src:local('Noto Sans KR'),local('NotoSansKR-Bold'),url('/assets/vendor/fonts/notosanskr-korean-700.woff2') format('woff2');unicode-range:U+1100-11FF,U+3001-303F,U+3130-318F,U+3200-321E,U+3260-327F,U+4E00-9FFF,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF,U+F900-FAFF,U+FF01-FFEE;}
  @font-face{font-family:'Noto Sans KR';font-style:normal;font-weight:800;font-display:swap;src:local('Noto Sans KR'),local('NotoSansKR-ExtraBold'),url('/assets/vendor/fonts/notosanskr-korean-800.woff2') format('woff2');unicode-range:U+1100-11FF,U+3001-303F,U+3130-318F,U+3200-321E,U+3260-327F,U+4E00-9FFF,U+A960-A97F,U+AC00-D7A3,U+D7B0-D7FF,U+F900-FAFF,U+FF01-FFEE;}
  :root{
    --bg:#f4f6fa; --panel:#ffffff; --line:#e3e8ef; --ink:#1f2937; --sub:#6b7280;
    --brand:#2563eb; --brand-d:#1d4ed8; --brand-soft:#eff4ff;
    --ok:#16a34a; --warn:#d97706; --danger:#dc2626; --radius:12px;
    --lnb:#101729; --lnb-2:#1c2740; --lnb-ink:#cbd5e1; --lnb-act:#3b82f6;
    --sh:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
    --lnb-w:250px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;}
  body{font-family:'Noto Sans KR',"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;}

  /* ===== layout ===== */
  .app{display:flex;min-height:100vh;}
  aside.lnb{width:var(--lnb-w);flex:none;background:var(--lnb);color:var(--lnb-2ink);
    position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:30;}
  main.main{margin-left:var(--lnb-w);flex:1;min-width:0;padding:28px 32px 60px;}

  /* ===== LNB ===== */
  .lnb-brand{padding:22px 22px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
  .lnb-brand .logo{font-size:16px;font-weight:800;color:#fff;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;}
  .lnb-brand .sub{font-size:11.5px;color:#7e8aa3;margin-top:5px;}
  .lnb-menu{padding:14px 12px;flex:1;overflow:auto;}
  .lnb-group{font-size:11px;font-weight:700;color:#5e6b85;letter-spacing:.6px;
    text-transform:uppercase;padding:8px 12px 6px;}
  .lnb-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;
    color:var(--lnb-ink);font-size:14px;font-weight:600;padding:11px 13px;border-radius:9px;
    cursor:pointer;text-align:left;margin-bottom:2px;transition:.15s;font-family:inherit;}
  .lnb-item:hover{background:var(--lnb-2);color:#fff;}
  .lnb-item.active{background:var(--lnb-act);color:#fff;box-shadow:0 4px 12px rgba(59,130,246,.4);}
  .lnb-item .ico{font-size:16px;width:20px;text-align:center;flex:none;}
  .lnb-item .badge{margin-left:auto;background:rgba(255,255,255,.16);color:#fff;font-size:11px;
    font-weight:700;padding:1px 9px;border-radius:20px;}
  .lnb-item.active .badge{background:rgba(255,255,255,.28);}
  .lnb-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08);}
  .lnb-foot .btn{width:100%;justify-content:center;}

  /* ===== topbar ===== */
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .topbar h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px;}
  .topbar .pg-sub{color:var(--sub);font-size:13px;margin-top:2px;}
  .topbar .spacer{flex:1}

  /* ===== panel / buttons ===== */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--sh);padding:22px;margin-bottom:20px;}
  .panel h2{margin:0 0 4px;font-size:16px;}
  .panel .desc{color:var(--sub);font-size:13px;margin:0 0 16px;}
  .btn{border:none;border-radius:9px;padding:10px 18px;font-size:14px;font-weight:600;
    cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px;font-family:inherit;}
  .btn.primary{background:var(--brand);color:#fff;} .btn.primary:hover{background:var(--brand-d);}
  .btn.ghost{background:#fff;color:#374151;border:1px solid #d4dae3;} .btn.ghost:hover{background:#f3f5f9;}
  .btn.sm{padding:6px 12px;font-size:12.5px;}
  .btn.danger{background:#fff;color:var(--danger);border:1px solid #f3c0c0;} .btn.danger:hover{background:#fef2f2;}

  /* ===== form grid ===== */
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px 16px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.c2{grid-column:span 2}.field.c3{grid-column:span 3}.field.c4{grid-column:span 4}
  .field.c6{grid-column:span 6}.field.c12{grid-column:span 12}
  .field label{font-size:12.5px;font-weight:600;color:#374151;}
  .field label .req{color:var(--danger);margin-left:2px;}
  .field input,.field select,.field textarea{
    width:100%;padding:9px 11px;border:1px solid #d4dae3;border-radius:9px;font-size:13.5px;
    background:#fff;color:var(--ink);font-family:inherit;transition:border .15s,box-shadow .15s;}
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
  .field textarea{resize:vertical;min-height:70px;}

  /* ===== toolbar ===== */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  .toolbar input,.toolbar select{padding:8px 10px;border:1px solid #d4dae3;border-radius:8px;font-size:13px;font-family:inherit;}
  .toolbar .spacer{flex:1}
  .count-chip{background:var(--brand-soft);color:var(--brand-d);font-weight:700;padding:6px 12px;border-radius:20px;font-size:13px;}

  /* ===== table ===== */
  .table-scroll{overflow:auto;border:1px solid var(--line);border-radius:10px;}
  table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:1100px;}
  th,td{padding:9px 11px;border-bottom:1px solid #eef1f5;text-align:left;vertical-align:middle;}
  th{background:#f7f9fc;font-weight:700;color:#475569;white-space:nowrap;position:sticky;top:0;z-index:1;}
  tbody tr:hover{background:#fafbfe;}
  td.name{font-weight:600;min-width:160px;}
  td.detail{max-width:280px;color:var(--sub);}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
  .tag.cat{background:#eef2ff;color:#4338ca;}
  .tag.pri-필수{background:#fee2e2;color:#b91c1c;} .tag.pri-권장{background:#fef3c7;color:#b45309;} .tag.pri-선택{background:#e5e7eb;color:#4b5563;}
  .tag.st-신규{background:#dbeafe;color:#1e40af;} .tag.st-검토중{background:#fef9c3;color:#854d0e;}
  .tag.st-승인{background:#dcfce7;color:#166534;} .tag.st-진행중{background:#cffafe;color:#155e75;}
  .tag.st-완료{background:#d1fae5;color:#065f46;} .tag.st-보류{background:#f3f4f6;color:#4b5563;}
  .tag.st-반려{background:#fee2e2;color:#991b1b;} .tag.st-운영서버반영{background:#ede9fe;color:#6d28d9;}
  .lvl{font-weight:700}.lvl-상{color:#dc2626}.lvl-중{color:#d97706}.lvl-하{color:#16a34a}
  .row-actions{display:flex;gap:6px;white-space:nowrap;}
  .empty{padding:50px;text-align:center;color:var(--sub);}

  /* ===== dashboard ===== */
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--sh);}
  .stat .lab{color:var(--sub);font-size:13px;font-weight:600;}
  .stat .num{font-size:30px;font-weight:800;margin-top:6px;letter-spacing:-1px;}
  .stat.b1 .num{color:var(--brand)} .stat.b2 .num{color:var(--danger)} .stat.b3 .num{color:var(--ok)} .stat.b4 .num{color:var(--warn)}
  .dash-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;}
  .bar-row .bl{width:96px;font-size:13px;font-weight:600;color:#374151;flex:none;}
  .bar-track{flex:1;background:#eef1f5;border-radius:6px;height:18px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#6366f1);border-radius:6px;}
  .bar-row .bv{width:64px;text-align:right;font-size:12.5px;color:var(--sub);flex:none;}

  /* ===== modal ===== */
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;
    justify-content:center;z-index:60;overflow:auto;padding:34px 16px;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;border-radius:14px;max-width:1000px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);}
  .modal-head{display:flex;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line);}
  .modal-head h2{margin:0;font-size:18px;}
  .modal-head .x{margin-left:auto;border:none;background:#f1f3f7;width:32px;height:32px;border-radius:8px;
    font-size:18px;cursor:pointer;color:#64748b;}
  .modal-head .x:hover{background:#e6e9ef;}
  .modal-body{padding:22px 24px;}
  .modal-foot{display:flex;gap:10px;padding:16px 24px;border-top:1px solid var(--line);}

  .toast{position:fixed;bottom:24px;left:calc(50% + var(--lnb-w)/2);transform:translateX(-50%) translateY(80px);
    background:#111827;color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;
    opacity:0;transition:.3s;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3);}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
  .hidden{display:none!important;}

  /* ===== mobile chrome (desktop: hidden) ===== */
  .mobile-top{display:none;align-items:center;gap:12px;position:sticky;top:0;z-index:25;
    background:var(--lnb);color:#fff;padding:11px 16px;}
  .mobile-top .hamb{background:rgba(255,255,255,.13);border:none;color:#fff;font-size:20px;
    width:40px;height:40px;border-radius:9px;cursor:pointer;line-height:1;flex:none;}
  .mobile-top .mt-title{font-weight:800;font-size:16px;}
  .lnb-overlay{position:fixed;inset:0;background:rgba(8,12,22,.55);z-index:29;opacity:0;
    visibility:hidden;transition:.25s;}
  .lnb-overlay.show{opacity:1;visibility:visible;}
  .lnb-x{display:none;position:absolute;top:16px;right:14px;background:rgba(255,255,255,.13);
    border:none;color:#fff;width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer;line-height:1;}
  aside.lnb{transition:transform .26s ease;}

  /* ===== tablet ===== */
  @media(max-width:1100px){
    main.main{padding:24px 22px 56px;}
    .stat-row{grid-template-columns:repeat(2,1fr);}
  }

  /* ===== mobile: off-canvas drawer ===== */
  @media(max-width:900px){
    .mobile-top{display:flex;}
    aside.lnb{transform:translateX(-100%);width:min(284px,84vw);box-shadow:0 0 44px rgba(0,0,0,.45);}
    aside.lnb.open{transform:translateX(0);}
    .lnb-x{display:block;}
    main.main{margin-left:0;padding:18px 16px 50px;}
    .topbar h1{font-size:19px;}
    .grid{grid-template-columns:repeat(2,1fr);}
    .field.c2,.field.c3,.field.c4,.field.c6,.field.c12{grid-column:span 2;}
    .dash-grid{grid-template-columns:1fr;}
    .toast{left:50%;}
    .modal-bg{padding:0;}
    .modal{border-radius:0;max-width:none;min-height:100vh;}
  }

  /* ===== small mobile ===== */
  @media(max-width:640px){
    .stat-row{grid-template-columns:1fr 1fr;gap:12px;}
    .stat{padding:14px 16px;} .stat .num{font-size:24px;}
    .topbar{flex-wrap:wrap;}
    .topbar #addBtn2{width:100%;justify-content:center;margin-top:4px;}
    .toolbar input[id="search"]{flex:1 1 100%;width:auto !important;}
    .toolbar select{flex:1 1 30%;}
    .toolbar .spacer{display:none;}
    .toolbar .count-chip{order:-1;}
    /* table -> cards */
    .panel{padding:14px;}
    .table-scroll{border:none;overflow:visible;}
    #reqTable{min-width:0;}
    #reqTable thead{display:none;}
    #reqTable,#reqTable tbody,#reqTable tr,#reqTable td{display:block;width:100%;}
    #reqTable tr{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;padding:8px 14px;background:#fff;box-shadow:var(--sh);}
    #reqTable td{border:none;padding:7px 0;display:flex;gap:12px;align-items:flex-start;}
    #reqTable td:not(:last-child){border-bottom:1px dashed #eef1f5;}
    #reqTable td::before{content:attr(data-label);font-weight:700;color:#64748b;font-size:11.5px;
      flex:none;width:82px;padding-top:2px;}
    #reqTable td.name{font-size:15px;} #reqTable td.detail{max-width:none;}
    #reqTable .row-actions{flex:1;}
    #reqTable .row-actions .btn{flex:1;justify-content:center;}
  }

  /* ===== very small ===== */
  @media(max-width:420px){
    .grid{grid-template-columns:1fr;}
    .field.c2,.field.c3,.field.c4,.field.c6,.field.c12{grid-column:span 1;}
    .stat-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<!-- ===== mobile top bar ===== -->
<header class="mobile-top">
  <button class="hamb" id="hambBtn" aria-label="메뉴 열기">☰</button>
  <span class="mt-title">📋 메디힘 요구사항</span>
</header>
<div class="lnb-overlay" id="lnbOverlay"></div>

<div class="app">
  <!-- ================= LNB ================= -->
  <aside class="lnb">
    <div class="lnb-brand">
      <button class="lnb-x" id="lnbClose" aria-label="메뉴 닫기">×</button>
      <div class="logo">📋 메디힘 요구사항</div>
      <div class="sub">Requirements Specification</div>
    </div>
    <nav class="lnb-menu">
      <div class="lnb-group">메뉴</div>
      <button class="lnb-item active" data-view="list">
        <span class="ico">📑</span> 요구사항 목록 <span class="badge" id="navCount">0</span>
      </button>
      <button class="lnb-item" data-view="dash">
        <span class="ico">📊</span> 요약 대시보드
      </button>
    </nav>
    <div class="lnb-foot">
      <button class="btn primary" id="addBtn">＋ 요구사항 추가</button>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <main class="main">

    <!-- ===== LIST VIEW ===== -->
    <section id="view-list">
      <div class="topbar">
        <div>
          <h1>요구사항 목록</h1>
          <div class="pg-sub">엑셀 기반 수집 리스트 · 선택/입력 항목으로 관리</div>
        </div>
        <span class="spacer"></span>
        <button class="btn primary" id="addBtn2">＋ 요구사항 추가</button>
      </div>
      <div class="panel">
        <div class="toolbar">
          <input id="search" placeholder="🔍 요구사항명 / 설명 검색" style="width:240px">
          <select id="fCat"><option value="">구분 전체</option></select>
          <select id="fPri"><option value="">우선순위 전체</option></select>
          <select id="fStatus"><option value="">상태 전체</option></select>
          <span class="spacer"></span>
          <span class="count-chip" id="dbStatus" title="">…</span>
          <span class="count-chip" id="listCount">0건</span>
          <button class="btn primary sm" id="exportXlsx">⬇ Excel (.xlsx)</button>
          <button class="btn ghost sm" id="exportCsv">⬇ CSV</button>
          <button class="btn ghost sm" id="exportJson">⬇ JSON 백업</button>
          <button class="btn ghost sm" id="importBtn">⬆ JSON 복원</button>
          <input type="file" id="importFile" accept=".json" class="hidden">
        </div>
        <div class="table-scroll">
          <table id="reqTable">
            <thead><tr>
              <th>#</th><th>구분</th><th>대분류 / 중분류</th><th>요구사항명</th><th>상세 설명</th>
              <th>요청</th><th>우선순위</th><th>중요/난이</th><th>버전</th><th>상태</th><th>관리</th>
            </tr></thead>
            <tbody id="reqBody"></tbody>
          </table>
        </div>
        <div class="empty hidden" id="emptyMsg">등록된 요구사항이 없습니다. 우측 상단 <b>＋ 요구사항 추가</b>로 등록하세요.</div>
      </div>
    </section>

    <!-- ===== DASHBOARD VIEW ===== -->
    <section id="view-dash" class="hidden">
      <div class="topbar">
        <div>
          <h1>요약 대시보드</h1>
          <div class="pg-sub">요구사항 현황 실시간 집계</div>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat b1"><div class="lab">전체 요구사항</div><div class="num" id="sTotal">0</div></div>
        <div class="stat b2"><div class="lab">필수 요구사항</div><div class="num" id="sReq">0</div></div>
        <div class="stat b3"><div class="lab">승인/완료</div><div class="num" id="sDone">0</div></div>
        <div class="stat b4"><div class="lab">총 예상공수(MD)</div><div class="num" id="sEffort">0</div></div>
      </div>
      <div class="dash-grid">
        <div class="panel"><h2>구분별 현황</h2><div id="dashCat"></div></div>
        <div class="panel"><h2>우선순위별 현황</h2><div id="dashPri"></div></div>
        <div class="panel"><h2>상태별 현황</h2><div id="dashStatus"></div></div>
        <div class="panel"><h2>목표 버전별 현황</h2><div id="dashVer"></div></div>
      </div>
    </section>

  </main>
</div>

<!-- ================= FORM MODAL ================= -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">요구사항 추가</h2>
      <button class="x" id="modalClose" type="button">×</button>
    </div>
    <form id="reqForm">
      <div class="modal-body">
        <input type="hidden" id="f_id">
        <div class="grid">
          <div class="field c2"><label>우선순위(순번)</label><select id="f_rank"></select></div>
          <div class="field c2"><label>구분 <span class="req">*</span></label><select id="f_category" required></select></div>
          <div class="field c4"><label>대분류 (1st Depth)</label><input id="f_major" placeholder="예: 유입 채널 다변화"></div>
          <div class="field c4"><label>중분류 (2nd Depth)</label><input id="f_middle" placeholder="예: 성과 추적"></div>

const API = '/api';
const onHttp = location.protocol === 'http:' || location.protocol === 'https:';
let useApi = false;
async function tryConnectApi(){
  if(!onHttp) return false;            // file:// 로 열면 서버 없음 → 로컬 모드
  try{
    const r = await fetch(API + '/options', {cache:'no-store'});
    if(!r.ok) throw new Error('options ' + r.status);
    const o = await r.json();
    const lab = g => (o[g]||[]).map(x=>x.label);
    if(o.category) OPT.category = lab('category');
    if(o.part)     OPT.part     = lab('part');
    if(o.priority) OPT.priority = lab('priority');
    if(o.level)    OPT.level    = lab('level');
    if(o.version)  OPT.version  = lab('version');
    if(o.status)   OPT.status   = lab('status');
    if(o.rank)     OPT.rank     = lab('rank');
    useApi = true;
  }catch(e){ useApi = false; }
  return useApi;
}
async function loadData(){
  if(useApi){
    const r = await fetch(API + '/requirements', {cache:'no-store'});
    if(!r.ok) throw new Error('목록 조회 실패 (' + r.status + ')');
    data = await r.json();
  } else { load(); }
}

}

  const saved = localStorage.getItem(STORE_KEY);
  if(saved){ try{ data = JSON.parse(saved); }catch(e){ data = SEED.slice(); } }
  else { data = SEED.slice(); }
  let mx = 0; data.forEach(d=>{ if(d.id>mx) mx=d.id; });
  data.forEach(d=>{ if(!d.id) d.id = ++mx; });
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
function nextId(){ return data.reduce((m,d)=>Math.max(m,d.id||0),0)+1; }

/* ---- save ---- */
form.addEventListener('submit', async e=>{
  e.preventDefault();
  const obj={}; FIELDS.forEach(k=>{ obj[k]=(document.getElementById('f_'+k).value||'').trim(); });
  const idVal=f_id.value;
  if(useApi){
    try{
      const url = API + '/requirements' + (idVal ? '/'+idVal : '');
      const r = await fetch(url, {method: idVal?'PUT':'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(obj)});
      if(!r.ok){ const er=await r.json().catch(()=>({})); throw new Error(er.error || ('HTTP '+r.status)); }
      await loadData();
      toast(idVal ? '요구사항이 수정되었습니다' : '요구사항이 추가되었습니다');
    }catch(err){ alert('저장 실패: '+err.message); return; }
  } else {
    if(idVal){ const i=data.findIndex(d=>d.id==idVal); obj.id=Number(idVal); data[i]=obj; toast('요구사항이 수정되었습니다'); }
    else { obj.id=nextId(); data.push(obj); toast('요구사항이 추가되었습니다'); }
    save();
  }
  closeModal(); renderTable(); updateCounts();
});
async function delItem(id){
  if(!confirm('이 요구사항을 삭제하시겠습니까?')) return;
  if(useApi){
    try{
      const r = await fetch(API + '/requirements/' + id, {method:'DELETE'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      await loadData();
    }catch(err){ alert('삭제 실패: '+err.message); return; }
  } else {
    data=data.filter(d=>d.id!=id); save();
  }
  renderTable(); updateCounts(); toast('삭제되었습니다');
}

/* ---- table ---- */
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function filtered(){
  const q=search.value.trim().toLowerCase(), c=fCat.value, p=fPri.value, s=fStatus.value;
  return data.filter(d=>{
    if(c&&d.category!==c) return false;
    if(p&&d.priority!==p) return false;
    if(s&&d.status!==s) return false;
    if(q){ const hay=((d.name||'')+' '+(d.detail||'')+' '+(d.purpose||'')+' '+(d.major||'')+' '+(d.middle||'')).toLowerCase();
      if(!hay.includes(q)) return false; }
    return true;
  });
}
function renderTable(){
  const rows=filtered();
  listCount.textContent=rows.length+'건';
  const body=document.getElementById('reqBody');
  if(rows.length===0){ body.innerHTML=''; emptyMsg.classList.remove('hidden'); return; }
  emptyMsg.classList.add('hidden');
  body.innerHTML=rows.map((d,i)=>{
    const cat=d.category?`<span class="tag cat">${esc(d.category)}</span>`:'';
    const pri=d.priority?`<span class="tag pri-${esc(d.priority)}">${esc(d.priority)}</span>`:'-';
    const st =d.status?`<span class="tag st-${esc(d.status)}">${esc(d.status)}</span>`:'-';
    const imp=d.importance?`<span class="lvl lvl-${esc(d.importance)}">${esc(d.importance)}</span>`:'-';
    const dif=d.difficulty?`<span class="lvl lvl-${esc(d.difficulty)}">${esc(d.difficulty)}</span>`:'-';
    const cat2=[d.major,d.middle].filter(Boolean).map(esc).join('<br><span style="color:#9aa3b2">└ ')+(d.middle?'</span>':'');
    return `<tr>
      <td data-label="#">${i+1}</td><td data-label="구분">${cat}</td><td data-label="분류">${cat2||'-'}</td>
      <td class="name" data-label="요구사항명">${esc(d.name)||'-'}</td>
      <td class="detail" data-label="상세">${esc((d.detail||d.purpose||'').slice(0,90))}${(d.detail||'').length>90?'…':''}</td>
      <td data-label="요청">${esc(d.requester)||'-'}<br><span style="color:#9aa3b2">${esc(d.reqPart||'')}</span></td>
      <td data-label="우선순위">${pri}</td><td data-label="중요/난이">${imp} / ${dif}</td><td data-label="버전">${esc(d.version)||'-'}</td><td data-label="상태">${st}</td>
      <td data-label="관리"><div class="row-actions">
        <button class="btn ghost sm" onclick="editItem(${d.id})">수정</button>
        <button class="btn danger sm" onclick="delItem(${d.id})">삭제</button>
      </div></td></tr>`;
  }).join('');
}

function updateCounts(){

function tally(key, order){
  const m={}; data.forEach(d=>{ const v=d[key]||'(미입력)'; m[v]=(m[v]||0)+1; });
  let keys=order?order.filter(k=>m[k]):Object.keys(m);
  order&&Object.keys(m).forEach(k=>{ if(!keys.includes(k)) keys.push(k); });
  return keys.map(k=>({k,n:m[k]}));
}
function bars(el, rows){
  const max=Math.max(1,...rows.map(r=>r.n)), tot=data.length||1;
  el.innerHTML=rows.map(r=>`<div class="bar-row">
    <div class="bl">${esc(r.k)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${r.n/max*100}%"></div></div>
    <div class="bv">${r.n}건 (${Math.round(r.n/tot*100)}%)</div></div>`).join('')||'<p class="desc">데이터 없음</p>';
}
function renderDash(){
  sTotal.textContent=data.length;
  sReq.textContent=data.filter(d=>d.priority==='필수').length;
  sDone.textContent=data.filter(d=>d.status==='승인'||d.status==='완료').length;
  sEffort.textContent=data.reduce((s,d)=>s+(parseFloat(d.effort)||0),0);
  bars(dashCat, tally('category', OPT.category));
  bars(dashPri, tally('priority', OPT.priority));
  bars(dashStatus, tally('status', OPT.status));
  bars(dashVer, tally('version', OPT.version));
}

/* ---- Excel(.xlsx) 내보내기 (라이브러리 없이 순수 JS로 생성) ---- */
function crc32(bytes){
  let t=crc32.t;
  if(!t){ t=crc32.t=[]; for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } }
  let crc=0^(-1);
  for(let i=0;i<bytes.length;i++) crc=(crc>>>8)^t[(crc^bytes[i])&0xFF];
  return (crc^(-1))>>>0;
}
function zipStored(files){
  const enc=new TextEncoder(), chunks=[], central=[]; let offset=0;
  const u16=v=>[v&0xFF,(v>>>8)&0xFF];
  const u32=v=>[v&0xFF,(v>>>8)&0xFF,(v>>>16)&0xFF,(v>>>24)&0xFF];
  files.forEach(f=>{
    const name=enc.encode(f.name), data=f.bytes, crc=crc32(data);
    chunks.push(new Uint8Array([].concat(
      u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),
      u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0))));
    chunks.push(name); chunks.push(data);
    central.push(new Uint8Array([].concat(
      u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),
      u32(crc),u32(data.length),u32(data.length),u16(name.length),
      u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset))));
    central.push(name);
    offset += 30+name.length+data.length;
  });
  const cdStart=offset; let cdSize=0;
  central.forEach(c=>{ chunks.push(c); cdSize+=c.length; });
  chunks.push(new Uint8Array([].concat(
    u32(0x06054b50),u16(0),u16(0),
    u16(central.length/2),u16(central.length/2),
    u32(cdSize),u32(cdStart),u16(0))));
  let total=chunks.reduce((s,c)=>s+c.length,0), out=new Uint8Array(total), p=0;
  chunks.forEach(c=>{ out.set(c,p); p+=c.length; });
  return new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function buildXlsxBlob(){
  const enc=new TextEncoder();
  const xesc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const colL=n=>{ let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-m-1)/26; } return s; };
  const H=v=>({v,header:true}), T=v=>({v:v==null?'':v}), N=v=>({v,num:true});
  function sheetXml(rows, colsXml){
    let body='';
    rows.forEach((cells,ri)=>{
      let r='<row r="'+(ri+1)+'">';
      cells.forEach((cell,ci)=>{
        const ref=colL(ci)+(ri+1);
        if(!cell){ return; }
        const s=cell.header?' s="1"':'';
        if(cell.num && cell.v!=='' && cell.v!=null && !isNaN(cell.v)){ r+='<c r="'+ref+'"'+s+'><v>'+cell.v+'</v></c>'; }
        else if(cell.v===''||cell.v==null){ if(cell.header) r+='<c r="'+ref+'"'+s+' t="inlineStr"><is><t></t></is></c>'; }
        else { r+='<c r="'+ref+'"'+s+' t="inlineStr"><is><t xml:space="preserve">'+xesc(cell.v)+'</t></is></c>'; }
      });
      body+=r+'</row>';
    });
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
      (colsXml||'')+'<sheetData>'+body+'</sheetData></worksheet>';
  }
  /* sheet1: 요구사항 목록 */
  const rows1=[ FIELDS.map(k=>H(LABELS[k])) ];
  data.forEach(d=>{
    rows1.push(FIELDS.map(k=>{
      if(k==='effort' && d[k]!=='' && d[k]!=null && !isNaN(d[k])) return N(d[k]);
      return T(d[k]);
    }));
  });
  const cols1='<cols><col min="1" max="2" width="11"/><col min="3" max="4" width="16"/>'+
    '<col min="5" max="5" width="22"/><col min="6" max="7" width="34"/>'+
    '<col min="8" max="26" width="14"/></cols>';
  /* sheet2: 요약 대시보드 */
  const tot=data.length, reqN=data.filter(d=>d.priority==='필수').length;
  const doneN=data.filter(d=>d.status==='승인'||d.status==='완료').length;
  const effN=data.reduce((s,d)=>s+(parseFloat(d.effort)||0),0);
  const rows2=[
    [H('📊 요구사항 현황 대시보드')], [],
    [H('전체 요구사항'), N(tot)],
    [H('필수 요구사항'), N(reqN)],
    [H('승인/완료'), N(doneN)],
    [H('총 예상공수(MD)'), N(effN)], []
  ];
  const section=(title, key, order)=>{
    rows2.push([H(title)]);
    rows2.push([H('항목'),H('건수'),H('비율(%)')]);
    tally(key, order).forEach(r=>rows2.push([T(r.k), N(r.n), N(tot?Math.round(r.n/tot*100):0)]));
    rows2.push([]);
  };
  section('구분별 현황','category',OPT.category);
  section('우선순위별 현황','priority',OPT.priority);
  section('상태별 현황','status',OPT.status);
  section('목표 버전별 현황','version',OPT.version);
  const cols2='<cols><col min="1" max="1" width="20"/><col min="2" max="3" width="12"/></cols>';

  const files=[
    {name:'[Content_Types].xml', bytes:enc.encode(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'+
      '<Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'+
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>')},
    {name:'_rels/.rels', bytes:enc.encode(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')},
    {name:'xl/workbook.xml', bytes:enc.encode(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
      '<sheets><sheet name="요구사항 목록" sheetId="1" r:id="rId1"/><sheet name="요약 대시보드" sheetId="2" r:id="rId2"/></sheets></workbook>')},
    {name:'xl/_rels/workbook.xml.rels', bytes:enc.encode(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'+
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/>'+
      '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>')},
    {name:'xl/styles.xml', bytes:enc.encode(
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
      '<fonts count="2"><font><sz val="11"/><name val="맑은 고딕"/></font>'+
      '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="맑은 고딕"/></font></fonts>'+
      '<fills count="3"><fill><patternFill patternType="none"/></fill>'+
      '<fill><patternFill patternType="gray125"/></fill>'+
      '<fill><patternFill patternType="solid"><fgColor rgb="FF2563EB"/><bgColor indexed="64"/></patternFill></fill></fills>'+
      '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'+
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
      '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"><alignment vertical="center" wrapText="1"/></xf></cellXfs>'+
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>')},
    {name:'xl/worksheets/sheet1.xml', bytes:enc.encode(sheetXml(rows1, cols1))},
    {name:'xl/worksheets/sheet2.xml', bytes:enc.encode(sheetXml(rows2, cols2))},
  ];
  return zipStored(files);
}
document.getElementById('exportXlsx').onclick=()=>{
  try{ dl(buildXlsxBlob(),'메디힘_요구사항.xlsx'); toast('Excel 파일을 내보냈습니다'); }
  catch(e){ alert('Excel 생성 실패: '+e.message); }
};

  if(useApi){ alert('DB 연결 모드에서는 JSON 복원이 비활성화됩니다.\n로컬(file://) 모드에서만 사용하세요. (DB는 db/seed.sql 로 적재)'); return; }

importFile.onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const arr=JSON.parse(r.result); if(Array.isArray(arr)){ data=arr; let mx=0;data.forEach(d=>{if(d.id>mx)mx=d.id});data.forEach(d=>{if(!d.id)d.id=++mx}); save(); updateCounts(); toast('복원 완료 ('+arr.length+'건)'); } }catch(err){ alert('JSON 파싱 실패'); } };
  r.readAsText(f); importFile.value='';
};
function dl(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click(); URL.revokeObjectURL(a.href); }

/* ---- toast ---- */
let toT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toT); toT=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---- init ---- */
(async function boot(){
  await tryConnectApi();      // 서버 있으면 DB 옵션으로 OPT 갱신 + useApi=true
  initSelects();              // (갱신된) OPT 기준으로 select 구성
  try{ await loadData(); }    // DB 또는 localStorage 에서 데이터 로드
  catch(e){ useApi=false; load(); }
  renderStatus();
  renderTable();
  updateCounts();
})();
